# TestFlight status check (and safe fixes) through the App Store Connect
# API. Runs only on pushes to this branch. May submit a build for TestFlight
# beta review (external testers); never submits for App Store review.
name: TestFlight status (ASC API)

on:
  push:
    branches: [ci/asc-testflight-status]
    paths: [.github/workflows/asc-testflight-status.yml, tools/asc_testflight_status.py]

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m pip install --quiet "pyjwt[crypto]==2.10.1"
      - name: Report and fix
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_APP_ID: "6836153137"
          FIX: "0"
          EXTERNAL_GROUP: "Trillium"
          BUILD: "6"
          WHAT_TO_TEST: "0.8.0 (6): on iPhone and iPad, app-generated MIDI from the handpan instrument view now keeps playing while you are in the synth or MIDI monitor app. Trillium keeps running in the background with silent audio (volume 0, mixed with other apps) while App-generated MIDI is on. The switch is remembered, so the Trillium Instrument source exists from launch; if a music app was already open, refresh its MIDI inputs. Open the view from Presets > Handpan instrument (prototype) > Open instrument view; it needs the board on USB for motion data. Bluetooth MIDI test: BLE-MIDI firmware on a board with a battery, then Settings > Bluetooth MIDI."
        run: python3 tools/asc_testflight_status.py
