# TestFlight status check (and safe fixes) through the App Store Connect
# API. Runs only on pushes to this branch. May submit a build for TestFlight
# beta review (external testers); never submits for App Store review.
name: TestFlight status (ASC API)

on:
  push:
    branches: [ci/asc-testflight-status]
    paths: [.github/workflows/asc-testflight-status.yml, tools/asc_testflight_status.py]

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m pip install --quiet "pyjwt[crypto]==2.10.1"
      - name: Report and fix
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_APP_ID: "6836153137"
          FIX: "1"
          EXTERNAL_GROUP: "Trillium"
          SUBMIT_BETA_REVIEW: "1"
          BUILD: "5"
          WAIT_PLATFORMS: "IOS,MAC_OS"
          WHAT_TO_TEST: "0.8.0 (5): app-generated MIDI from the handpan instrument view now works on iPhone and iPad (the Trillium Instrument MIDI source no longer fails with -10844). Open it from Presets > Handpan instrument (prototype) > Open instrument view, turn on App-generated MIDI and pick Trillium Instrument in a music app. The view needs the board on USB for motion data. Bluetooth MIDI test: install the BLE-MIDI firmware (xiao-sense-fw-ble-midi-0.8.0.uf2) on a board with a battery, then Settings > Bluetooth MIDI. Bluetooth carries the board instrument MIDI only."
        run: python3 tools/asc_testflight_status.py
